<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试 lunar-javascript 在浏览器中是否可用</title>
</head>
<body>
    <h1>测试 lunar-javascript 在浏览器中是否可用</h1>
    <div id="result"></div>
    
    <!-- 直接引入 lunar-javascript 库 -->
    <script src="./node_modules/lunar-javascript/lunar.js"></script>
    
    <script>
        try {
            console.log('开始测试 lunar-javascript...');
            
            // 测试 Solar 类
            const solar = Solar.fromYmdHms(1983, 5, 20, 0, 30, 0);
            console.log('Solar 创建成功:', solar);
            
            // 测试 getLunar 方法
            const lunar = solar.getLunar();
            console.log('getLunar 成功:', lunar);
            
            // 测试 getEightChar 方法
            const eightChar = lunar.getEightChar();
            console.log('getEightChar 成功:', eightChar);
            
            // 测试获取四柱
            const yearPillar = eightChar.getYear();
            const monthPillar = eightChar.getMonth();
            const dayPillar = eightChar.getDay();
            const hourPillar = eightChar.getTime();
            
            console.log('四柱计算成功:');
            console.log('年柱:', yearPillar);
            console.log('月柱:', monthPillar);
            console.log('日柱:', dayPillar);
            console.log('时柱:', hourPillar);
            
            // 显示结果
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <h2>测试成功！</h2>
                <p>年柱: ${yearPillar}</p>
                <p>月柱: ${monthPillar}</p>
                <p>日柱: ${dayPillar}</p>
                <p>时柱: ${hourPillar}</p>
                <p>所有功能正常工作。</p>
            `;
            resultDiv.style.color = 'green';
            
        } catch (error) {
            console.error('测试失败:', error);
            console.error('错误详情:', error.message);
            console.error('错误堆栈:', error.stack);
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <h2>测试失败！</h2>
                <p>错误信息: ${error.message}</p>
                <p>请查看浏览器控制台获取详细信息。</p>
            `;
            resultDiv.style.color = 'red';
        }
    </script>
</body>
</html>
