<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生决策宗师 - K线</title>
    <style id="theme-vars">
/* ===== 人生决策宗师 — Decision OS Design Tokens ===== */
/* Based on AETHERIA Neo-Mysticism System */
/* Semantic shift: "精密仪器" not "玄学神坛" */

:root {
  /* Brand Colors - HSL */
  --primary: 53 73% 76%;
  --primary-light: 48 70% 84%;
  --primary-dim: 42 45% 55%;
  --secondary: 265 100% 86%;
  --secondary-container: 265 60% 50%;
  --tertiary: 163 100% 52%;

  /* Surface Hierarchy */
  --surface-base: 220 20% 7%;
  --surface-container: 220 15% 13%;
  --surface-container-low: 220 15% 10%;
  --surface-container-lowest: 220 25% 5%;
  --surface-container-high: 220 14% 17%;

  /* On-Surface */
  --on-surface: 220 12% 91%;
  --on-surface-variant: 35 27% 77%;
  --on-primary: 0 0% 0%;
  --on-secondary: 0 0% 0%;

  /* Utility */
  --outline: 35 16% 56%;
  --outline-variant: 35 18% 30%;
  --error: 5 100% 86%;

  /* Border & Ring */
  --border: 220 14% 17%;
  --input: 220 14% 17%;
  --ring: 53 73% 76%;

  /* Background & Foreground */
  --background: 220 20% 7%;
  --foreground: 220 12% 91%;

  /* Muted */
  --muted: 220 15% 13%;
  --muted-foreground: 35 15% 55%;

  /* Popover */
  --popover: 220 15% 10%;
  --popover-foreground: 220 12% 91%;

  /* Card */
  --card: 220 15% 10%;
  --card-foreground: 220 12% 91%;

  /* Destructive */
  --destructive: 5 100% 86%;
  --destructive-foreground: 0 0% 0%;

  /* Radius */
  --radius: 12px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Primary container */
  --primary-container: 53 50% 40%;

  /* Extended palette */
  --shumiyuan-deep: 220 35% 8%;
  --shumiyuan-graphite: 220 12% 12%;
  --shumiyuan-ink: 220 20% 5%;
  --shumiyuan-gold-glow: 53 73% 76%;
  --shumiyuan-violet-glow: 265 100% 86%;
  --shumiyuan-risk: 5 80% 65%;
  --shumiyuan-safe: 163 60% 45%;
  --shumiyuan-warn: 35 90% 60%;

  /* Decision OS semantic colors */
  --phase-expand: 163 60% 45%;
  --phase-explore: 220 80% 60%;
  --phase-repair: 35 90% 60%;
  --phase-contract: 5 80% 65%;

  /* Dimension colors */
  --dim-time: 220 80% 60%;
  --dim-position: 163 60% 45%;
  --dim-mind: 265 100% 86%;

  /* State */
  --state-success: 163 100% 52%;
  --state-warning: 35 90% 60%;
  --state-error: 5 80% 65%;
  --state-info: 220 80% 60%;

  /* Typography */
  --font-display: 'Noto Serif SC', 'STSong', 'SimSun', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Manrope', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  /* Font sizes */
  --text-hero: 2rem;
  --text-h1: 1.5rem;
  --text-h2: 1.25rem;
  --text-h3: 1.125rem;
  --text-body: 0.875rem;
  --text-small: 0.75rem;
  --text-caption: 0.6875rem;

  /* Spacing */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 24px;
  --space-2xl: 32px;
  --space-3xl: 48px;

  /* Shadows */
  --shadow-card: 0 1px 3px hsl(var(--surface-base) / 0.5);
  --shadow-elevated: 0 4px 12px hsl(var(--surface-base) / 0.3);
}

/* ===== Light Theme ===== */
[data-theme="light"] {
  --primary: 211 100% 50%;
  --primary-light: 211 100% 60%;
  --primary-dim: 211 80% 40%;
  --secondary: 265 65% 60%;
  --secondary-container: 265 60% 50%;
  --tertiary: 163 100% 40%;

  --surface-base: 0 0% 100%;
  --surface-container: 0 0% 96%;
  --surface-container-low: 0 0% 98%;
  --surface-container-lowest: 0 0% 92%;
  --surface-container-high: 0 0% 90%;

  --on-surface: 0 0% 12%;
  --on-surface-variant: 240 2% 54%;
  --on-primary: 0 0% 100%;
  --on-secondary: 0 0% 100%;

  --outline: 240 5% 64%;
  --outline-variant: 240 5% 88%;
  --error: 3 100% 59%;

  --border: 240 5% 84%;
  --input: 240 5% 84%;
  --ring: 211 100% 50%;

  --background: 0 0% 100%;
  --foreground: 0 0% 12%;

  --muted: 0 0% 96%;
  --muted-foreground: 240 2% 54%;

  --popover: 0 0% 100%;
  --popover-foreground: 0 0% 12%;

  --card: 0 0% 100%;
  --card-foreground: 0 0% 12%;

  --destructive: 3 100% 59%;
  --destructive-foreground: 0 0% 100%;

  --radius: 12px;

  --primary-container: 211 100% 90%;

  --shumiyuan-deep: 220 10% 95%;
  --shumiyuan-graphite: 220 8% 90%;
  --shumiyuan-ink: 220 8% 96%;
  --shumiyuan-gold-glow: 211 100% 50%;
  --shumiyuan-violet-glow: 265 65% 60%;
  --shumiyuan-risk: 3 100% 59%;
  --shumiyuan-safe: 163 100% 40%;
  --shumiyuan-warn: 39 100% 55%;

  --phase-expand: 163 100% 40%;
  --phase-explore: 220 80% 50%;
  --phase-repair: 39 100% 55%;
  --phase-contract: 3 100% 59%;

  --dim-time: 220 80% 50%;
  --dim-position: 163 100% 40%;
  --dim-mind: 265 65% 60%;

  --state-success: 163 100% 40%;
  --state-warning: 39 100% 55%;
  --state-error: 3 100% 59%;
  --state-info: 220 80% 50%;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--on-primary);
    --color-secondary: var(--on-secondary);
  }
  @layer base {
    body { background: var(--on-surface); color: var(--on-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-[375px] mx-auto pb-20">

        <!-- Header Bar -->
        <header class="sticky top-0 z-30 flex items-center justify-between px-5 py-3" style="background: hsl(var(--background) / 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid hsl(var(--outline-variant) / 0.3);">
            <h1 class="text-[1.125rem] font-semibold tracking-tight" style="font-family: var(--font-display); color: hsl(var(--on-surface));">命运 K 线</h1>
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5">
                    <span class="inline-flex items-center px-3 py-1 text-[0.75rem] font-medium rounded-lg whitespace-nowrap" style="background: hsl(var(--primary) / 0.15); color: hsl(var(--primary)); border: 1px solid hsl(var(--primary) / 0.3);">近6月</span>
                </div>
                <button class="inline-flex items-center justify-center w-8 h-8 rounded-lg" style="color: hsl(var(--on-surface-variant));" aria-label="分享">
                    <i data-lucide="share-2" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <!-- Layer 1: K-line Chart + Trend Judgment (Expanded) -->
        <section class="px-4 pt-4 pb-2">

            <!-- K-line Chart Card -->
            <div class="rounded-lg p-3" style="background: hsl(var(--surface-container-low)); border: 1px solid hsl(var(--outline-variant) / 0.25);">
                <div class="relative flex" style="height: 200px;">

                    <!-- Y-axis labels -->
                    <div class="flex flex-col justify-between py-1 pr-2 shrink-0" style="width: 36px;">
                        <span class="text-[0.625rem]" style="color: hsl(var(--muted-foreground));">90</span>
                        <span class="text-[0.625rem]" style="color: hsl(var(--muted-foreground));">80</span>
                        <span class="text-[0.625rem]" style="color: hsl(var(--muted-foreground));">70</span>
                        <span class="text-[0.625rem]" style="color: hsl(var(--muted-foreground));">60</span>
                        <span class="text-[0.625rem]" style="color: hsl(var(--muted-foreground));">50</span>
                    </div>

                    <!-- Chart area -->
                    <div class="flex-1 relative">
                        <!-- Candlestick bars -->
                        <div class="absolute inset-0 flex items-end justify-around px-1" style="padding-bottom: 40px;">

                            <!-- Bar 1 - Red (down) -->
                            <div class="flex flex-col items-center" style="width: 20px;">
                                <div class="w-px" style="height: 16px; background: hsl(var(--state-error));"></div>
                                <div class="w-[14px] rounded-[1px]" style="height: 48px; background: hsl(var(--state-error));"></div>
                                <div class="w-px" style="height: 8px; background: hsl(var(--state-error));"></div>
                            </div>

                            <!-- Bar 2 - Green (up) -->
                            <div class="flex flex-col items-center" style="width: 20px;">
                                <div class="w-px" style="height: 12px; background: hsl(var(--state-success));"></div>
                                <div class="w-[14px] rounded-[1px]" style="height: 60px; background: hsl(var(--state-success));"></div>
                                <div class="w-px" style="height: 10px; background: hsl(var(--state-success));"></div>
                            </div>

                            <!-- Bar 3 - Green (up) -->
                            <div class="flex flex-col items-center" style="width: 20px;">
                                <div class="w-px" style="height: 6px; background: hsl(var(--state-success));"></div>
                                <div class="w-[14px] rounded-[1px]" style="height: 72px; background: hsl(var(--state-success));"></div>
                                <div class="w-px" style="height: 14px; background: hsl(var(--state-success));"></div>
                            </div>

                            <!-- Bar 4 - Red (down) -->
                            <div class="flex flex-col items-center" style="width: 20px;">
                                <div class="w-px" style="height: 18px; background: hsl(var(--state-error));"></div>
                                <div class="w-[14px] rounded-[1px]" style="height: 40px; background: hsl(var(--state-error));"></div>
                                <div class="w-px" style="height: 8px; background: hsl(var(--state-error));"></div>
                            </div>

                            <!-- Bar 5 - Green (up) -->
                            <div class="flex flex-col items-center" style="width: 20px;">
                                <div class="w-px" style="height: 10px; background: hsl(var(--state-success));"></div>
                                <div class="w-[14px] rounded-[1px]" style="height: 56px; background: hsl(var(--state-success));"></div>
                                <div class="w-px" style="height: 12px; background: hsl(var(--state-success));"></div>
                            </div>

                            <!-- Bar 6 - Green (up) -->
                            <div class="flex flex-col items-center" style="width: 20px;">
                                <div class="w-px" style="height: 4px; background: hsl(var(--state-success));"></div>
                                <div class="w-[14px] rounded-[1px]" style="height: 80px; background: hsl(var(--state-success));"></div>
                                <div class="w-px" style="height: 16px; background: hsl(var(--state-success));"></div>
                            </div>

                            <!-- Bar 7 - Red (down) -->
                            <div class="flex flex-col items-center" style="width: 20px;">
                                <div class="w-px" style="height: 20px; background: hsl(var(--state-error));"></div>
                                <div class="w-[14px] rounded-[1px]" style="height: 36px; background: hsl(var(--state-error));"></div>
                                <div class="w-px" style="height: 6px; background: hsl(var(--state-error));"></div>
                            </div>

                            <!-- Bar 8 - Green (up) -->
                            <div class="flex flex-col items-center" style="width: 20px;">
                                <div class="w-px" style="height: 8px; background: hsl(var(--state-success));"></div>
                                <div class="w-[14px] rounded-[1px]" style="height: 68px; background: hsl(var(--state-success));"></div>
                                <div class="w-px" style="height: 10px; background: hsl(var(--state-success));"></div>
                            </div>

                            <!-- Bar 9 - Green (up) -->
                            <div class="flex flex-col items-center" style="width: 20px;">
                                <div class="w-px" style="height: 2px; background: hsl(var(--state-success));"></div>
                                <div class="w-[14px] rounded-[1px]" style="height: 88px; background: hsl(var(--state-success));"></div>
                                <div class="w-px" style="height: 18px; background: hsl(var(--state-success));"></div>
                            </div>

                            <!-- Bar 10 - Red (down, small) -->
                            <div class="flex flex-col items-center" style="width: 20px;">
                                <div class="w-px" style="height: 14px; background: hsl(var(--state-error));"></div>
                                <div class="w-[14px] rounded-[1px]" style="height: 28px; background: hsl(var(--state-error));"></div>
                                <div class="w-px" style="height: 10px; background: hsl(var(--state-error));"></div>
                            </div>

                        </div>

                        <!-- Moving Average Line (SVG overlay) -->
                        <svg class="absolute inset-0 pointer-events-none" style="padding-bottom: 40px;" viewBox="0 0 260 160" preserveAspectRatio="none">
                            <polyline fill="none" stroke="hsl(var(--primary))" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                                points="13,110 39,95 65,80 91,100 117,85 143,65 169,90 195,72 221,50 247,68" />
                        </svg>

                        <!-- Volume bars at bottom -->
                        <div class="absolute bottom-0 left-0 right-0 flex items-end justify-around px-1" style="height: 36px;">
                            <div class="rounded-[1px]" style="width: 14px; height: 16px; background: hsl(var(--state-error) / 0.2);"></div>
                            <div class="rounded-[1px]" style="width: 14px; height: 22px; background: hsl(var(--state-success) / 0.2);"></div>
                            <div class="rounded-[1px]" style="width: 14px; height: 28px; background: hsl(var(--state-success) / 0.2);"></div>
                            <div class="rounded-[1px]" style="width: 14px; height: 14px; background: hsl(var(--state-error) / 0.2);"></div>
                            <div class="rounded-[1px]" style="width: 14px; height: 20px; background: hsl(var(--state-success) / 0.2);"></div>
                            <div class="rounded-[1px]" style="width: 14px; height: 32px; background: hsl(var(--state-success) / 0.2);"></div>
                            <div class="rounded-[1px]" style="width: 14px; height: 12px; background: hsl(var(--state-error) / 0.2);"></div>
                            <div class="rounded-[1px]" style="width: 14px; height: 24px; background: hsl(var(--state-success) / 0.2);"></div>
                            <div class="rounded-[1px]" style="width: 14px; height: 34px; background: hsl(var(--state-success) / 0.2);"></div>
                            <div class="rounded-[1px]" style="width: 14px; height: 10px; background: hsl(var(--state-error) / 0.2);"></div>
                        </div>

                        <!-- MA legend -->
                        <div class="absolute top-1 right-1 flex items-center gap-1">
                            <span class="text-[0.5625rem]" style="color: hsl(var(--primary));">MA7</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Trend Judgment Card -->
            <div class="rounded-lg p-3 mt-2" style="background: hsl(var(--surface-container-low)); border: 1px solid hsl(var(--outline-variant) / 0.25);">
                <div class="flex items-center gap-2 mb-2">
                    <span class="inline-flex items-center px-2 py-0.5 text-[0.6875rem] font-medium rounded-md whitespace-nowrap" style="background: hsl(var(--state-success) / 0.15); color: hsl(var(--state-success));">上升</span>
                    <span class="text-[0.8125rem] font-medium truncate" style="color: hsl(var(--on-surface));">上升中的回调阶段</span>
                </div>
                <div class="flex items-center gap-4 text-[0.75rem] mb-2">
                    <span style="color: hsl(var(--muted-foreground));">支撑位</span>
                    <span class="font-medium" style="color: hsl(var(--primary));">72.3</span>
                    <span class="w-px h-3" style="background: hsl(var(--outline-variant) / 0.4);"></span>
                    <span style="color: hsl(var(--muted-foreground));">压力位</span>
                    <span class="font-medium" style="color: hsl(var(--primary));">85.6</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[0.6875rem] shrink-0" style="color: hsl(var(--muted-foreground));">置信度 78%</span>
                    <div class="flex-1 h-1.5 rounded-full overflow-hidden" style="background: hsl(var(--outline-variant) / 0.3);">
                        <div class="h-full rounded-full" style="width: 78%; background: hsl(var(--primary));"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Layer 2: Dimension Quick View (Collapsed) -->
        <section class="px-4 pb-2">
            <div class="rounded-lg overflow-hidden" style="background: hsl(var(--surface-container-low)); border: 1px solid hsl(var(--outline-variant) / 0.25);">
                <button class="w-full flex items-center justify-between px-4 py-3" aria-expanded="false">
                    <span class="text-[0.8125rem] font-medium" style="color: hsl(var(--on-surface));">时 · 位 · 心 维度速览</span>
                    <i data-lucide="chevron-down" class="w-4 h-4" style="color: hsl(var(--muted-foreground));"></i>
                </button>
            </div>
        </section>

        <!-- Layer 3: Evidence + Support/Resistance (Collapsed) -->
        <section class="px-4 pb-2">
            <div class="rounded-lg overflow-hidden" style="background: hsl(var(--surface-container-low)); border: 1px solid hsl(var(--outline-variant) / 0.25);">
                <button class="w-full flex items-center justify-between px-4 py-3" aria-expanded="false">
                    <span class="text-[0.8125rem] font-medium" style="color: hsl(var(--on-surface));">操盘证据 + 支撑压力</span>
                    <i data-lucide="chevron-down" class="w-4 h-4" style="color: hsl(var(--muted-foreground));"></i>
                </button>
            </div>
        </section>

        <!-- Quick Action Bar -->
        <section class="px-4 pt-3 pb-4">
            <button class="w-full flex items-center justify-center py-3 text-[0.9375rem] font-semibold rounded-lg" style="background: hsl(var(--primary)); color: hsl(var(--on-primary)); box-shadow: 0 2px 8px hsl(var(--primary) / 0.25);">
                问张半山
            </button>
        </section>

        <!-- Bottom Navigation -->
        <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[375px] flex items-center justify-around py-2 z-40" style="background: hsl(var(--surface-container)); border-top: 1px solid hsl(var(--outline-variant) / 0.3); padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));">
            <a href="#" class="flex flex-col items-center gap-0.5 px-3 py-1" style="color: hsl(var(--muted-foreground));">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="text-[0.625rem]">首页</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-0.5 px-3 py-1" style="color: hsl(var(--muted-foreground));">
                <i data-lucide="waves" class="w-5 h-5"></i>
                <span class="text-[0.625rem]">潮汐</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-0.5 px-3 py-1" style="color: hsl(var(--primary));">
                <i data-lucide="candlestick-chart" class="w-5 h-5"></i>
                <span class="text-[0.625rem] font-medium">K线</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-0.5 px-3 py-1" style="color: hsl(var(--muted-foreground));">
                <i data-lucide="book-open" class="w-5 h-5"></i>
                <span class="text-[0.625rem]">账本</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-0.5 px-3 py-1" style="color: hsl(var(--muted-foreground));">
                <i data-lucide="user" class="w-5 h-5"></i>
                <span class="text-[0.625rem]">我的</span>
            </a>
        </nav>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
