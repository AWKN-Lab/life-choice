# P1.5-1: 高风险场景检测规则
# 8 种场景，关键词匹配 + 固定回复模板
# 规则顺序重要：更具体的场景排在前面，避免被通用规则抢先匹配

scenarios:
  - id: credibility_challenge
    name: 可信度质疑
    description: 用户质疑张半山的准确性
    keywords:
      - "你准吗"
      - "准不准"
      - "你算的准吗"
      - "可信吗"
      - "真的假的"
      - "骗人的吧"
      - "不准"
    patterns:
      - "你.*准.*吗"
      - "算.*准"
    response: |
      我理解你的疑虑。命理不是预言，是推演——推演的准确度取决于你给的信息有多真。
      你问得越具体，我看得越清楚。不如先试一次，问一个你最关心的事？

  - id: error_correction
    name: 纠错反馈
    description: 用户指出张半山之前的判断有误
    keywords:
      - "你上次说错了"
      - "你说错了"
      - "上次不准"
      - "跟上次不一样"
      - "你之前说的"
    patterns:
      - "上次.*说错"
      - "之前.*不准"
      - "你说.*不对"
    response: |
      你说得对，我之前的判断可能不够准确。让我重新审视一下——
      1. 上次我基于什么信息做了判断？
      2. 现在有什么新的变化？
      3. 之前的结论哪里出了偏差？
      请告诉我具体情况，我会重新推演。

  # 专业场景排在 major_decision 之前，避免通用规则抢先匹配
  - id: medical_inquiry
    name: 医疗咨询
    description: 用户询问医疗诊断或治疗建议
    keywords:
      - "要不要做手术"
      - "这个病怎么治"
      - "吃什么药"
      - "化疗效果"
      - "检查结果怎么看"
      - "能不能治好"
      - "手术风险"
      - "吃什么药好"
    patterns:
      - "做.*手术"
      - "病.*怎么治"
      - "吃.*药"
      - "化疗.*效果"
      - "检查结果.*看"
      - "能.*治好"
    response: |
      我理解你对健康的担忧，但医疗问题必须由专业医生来判断。
      命理可以看趋势，但不能替代医学诊断——
      1. 请先去正规医院做检查
      2. 听从主治医生的专业建议
      3. 如果是重大治疗决策，建议多看几位专家
      你的身体值得最专业的对待，别拿命理当处方。

  - id: legal_inquiry
    name: 法律咨询
    description: 用户询问法律纠纷或诉讼建议
    keywords:
      - "该不该起诉"
      - "合同纠纷怎么办"
      - "离婚协议怎么签"
      - "官司能赢吗"
      - "律师费多少"
      - "怎么打官司"
      - "违法吗"
      - "告他"
    patterns:
      - "该.*起诉"
      - "合同.*纠纷"
      - "离婚.*协议"
      - "官司.*赢"
      - "律师.*费"
      - "怎么.*打官司"
    response: |
      法律问题不是我能替你判断的，但我可以帮你理清思路——
      1. 先把事实理清楚：发生了什么？损失了什么？
      2. 保留所有证据：聊天记录、合同、转账凭证
      3. 找专业律师咨询，很多律所提供免费初诊
      命理看的是趋势，法律要的是证据。别混着用。

  - id: financial_inquiry
    name: 金融投资咨询
    description: 用户询问具体投资决策或承诺保本收益
    keywords:
      - "稳赚不赔"
      - "保本理财"
      - "翻倍收益"
      - "内幕消息"
      - "全仓买入"
      - "推荐股票"
      - "保收益"
      - "高回报投资"
    patterns:
      - "稳赚.*不赔"
      - "保本.*理财"
      - "翻倍.*收益"
      - "内幕.*消息"
      - "全仓.*买入"
      - "推荐.*股票"
    response: |
      投资有风险，命理不能替你做投资决策——
      1. 任何承诺"稳赚不赔"的都是骗局
      2. 投资前做好功课，了解风险承受能力
      3. 不要把全部身家押在一个方向上
      命理可以看财运趋势，但具体买什么、什么时候买，请咨询持牌理财顾问。

  # 通用场景放在专业场景之后
  - id: major_decision
    name: 重大决策请求
    description: 用户要求张半山替自己做重大决定
    keywords:
      - "我该不该离婚"
      - "该不该辞职"
      - "要不要分手"
      - "帮我决定"
      - "你告诉我该不该"
      - "要不要放弃"
    patterns:
      - "该不该.*[离婚辞职分手放弃]"
      - "帮我.*决定"
      - "告诉.*该不该"
    response: |
      这种大事，我不能替你做决定。但我可以帮你理清——
      你现在犹豫，说明两边都有让你放不下的东西。
      让我帮你分析一下：如果选A，你要承担什么？如果选B，你要放弃什么？
      看清代价，你自然知道怎么选。

  - id: repeated_question
    name: 重复追问
    description: 用户反复问同一个问题
    keywords: []
    patterns:
      - ".{0,5}(还是|又|再).{0,10}(问|说|想问)"
    response: |
      你又问了这个——说明这件事一直压在你心里。
      重复问同一个问题，往往不是在找答案，而是在找勇气。
      让我帮你看看：上次你问了什么，这次有什么变化？

  - id: emotional_distress
    name: 情绪激动
    description: 用户表现出强烈的情绪波动
    keywords:
      - "我好痛苦"
      - "受不了了"
      - "活不下去"
      - "太痛苦了"
      - "崩溃了"
      - "绝望"
    patterns:
      - "好.*痛苦"
      - "受.*不了"
      - "活.*不下"
    response: |
      我听到你了。你现在很不容易。
      在我们继续之前，我想确认：你现在安全吗？
      如果你正在经历非常困难的时刻，请记住——
      全国24小时心理援助热线：400-161-9995
      你不需要独自承受。
