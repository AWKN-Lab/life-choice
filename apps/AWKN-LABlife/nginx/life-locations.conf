# 人生决策宗师 Nginx 配置片段 - 插入到 awkn.cn.conf 的 server 块中
# 放在 location /lingyang/ 之后、location /api/ 之前

    # ==========================================
    # 人生决策宗师 API 反向代理
    # ==========================================
    location /life/api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    # life 静态资源单独处理，避免走 SPA fallback
    location ^~ /life/assets/ {
        alias /www/wwwroot/awkn-lab/life/assets/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ==========================================
    # 人生决策宗师 SPA - /life/ 子路径
    # ==========================================
    location ^~ /life/ {
        alias /www/wwwroot/awkn-lab/life/;
        index index.html;
        try_files $uri $uri/ @life_spa;
    }

    # SPA 命名 fallback，避免 alias + try_files 循环
    location @life_spa {
        root /www/wwwroot/awkn-lab;
        try_files /life/index.html =404;
    }
