<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案F - 黑金新中式（中间方案）</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --surface: #0f1318;
      --surface-low: #161a1f;
      --surface-container: #1c2026;
      --surface-high: #252a30;
      --primary: #c9a962;
      --primary-light: #e0c98a;
      --secondary: #d7baff;
      --tertiary: #00eab2;
      --on-surface: #e8e4dc;
      --on-surface-variant: #b8b0a0;
      --outline: #8a8070;
      --outline-variant: #3a3830;
    }
    
    body {
      font-family: 'Manrope', sans-serif;
      background-color: var(--surface);
      color: var(--on-surface);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    
    .font-serif-sc { font-family: 'Noto Serif SC', serif; }
    
    /* 五行色 */
    .wu-xing-wood { color: #00eab2; }
    .wu-xing-fire { color: #ffb4ab; }
    .wu-xing-earth { color: #c9a962; }
    .wu-xing-metal { color: #e8e4dc; }
    .wu-xing-water { color: #d7baff; }
    
    /* 卡片 */
    .card-mystic {
      background: var(--surface-low);
      border: 1px solid rgba(201, 169, 98, 0.15);
      transition: all 0.3s ease;
    }
    .card-mystic:hover {
      border-color: rgba(201, 169, 98, 0.35);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    /* 渐入动画 */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up { animation: fadeInUp 0.5s ease forwards; }
    .stagger-1 { animation-delay: 0.08s; opacity: 0; }
    .stagger-2 { animation-delay: 0.16s; opacity: 0; }
    .stagger-3 { animation-delay: 0.24s; opacity: 0; }
    .stagger-4 { animation-delay: 0.32s; opacity: 0; }
    .stagger-5 { animation-delay: 0.4s; opacity: 0; }
    
    /* 金色渐变分隔线 */
    .divider-gold {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      opacity: 0.3;
    }
    
    /* 印章（新中式元素） */
    .seal {
      border: 2px solid var(--primary);
      color: var(--primary);
      transform: rotate(12deg);
    }
  </style>
</head>
<body>
  <div class="min-h-screen pb-24">
    
    <!-- 顶部标题 - 黑金新中式融合 -->
    <div class="px-4 pt-8 pb-6 animate-fade-in-up">
      <div class="flex items-center justify-center gap-3">
        <div class="h-px flex-1 bg-gradient-to-r from-transparent to-[#3a3830]"></div>
        <div class="text-center">
          <h1 class="text-xl font-serif-sc text-[#c9a962] tracking-wider">初步结论</h1>
          <div class="flex items-center justify-center gap-1.5 mt-2">
            <span class="w-1 h-1 rounded-full bg-[#c9a962]"></span>
            <span class="w-1 h-1 rounded-full bg-[#c9a962]/50"></span>
            <span class="w-1 h-1 rounded-full bg-[#c9a962]/25"></span>
          </div>
        </div>
        <div class="h-px flex-1 bg-gradient-to-l from-transparent to-[#3a3830]"></div>
      </div>
    </div>

    <!-- 四柱卡片 -->
    <div class="mx-4 mb-6 animate-fade-in-up stagger-1">
      <div class="card-mystic rounded-2xl p-5">
        <div class="flex items-center justify-between mb-4">
          <div class="text-sm text-[#b8b0a0]">四柱八字</div>
          <div class="seal w-9 h-9 rounded flex items-center justify-center">
            <span class="text-[10px] font-serif-sc font-bold">命</span>
          </div>
        </div>
        
        <div class="grid grid-cols-4 gap-3">
          <div class="text-center">
            <div class="text-[10px] text-[#8a8070] mb-1 uppercase tracking-wider">年柱</div>
            <div class="flex items-center justify-center gap-0.5">
              <span class="text-lg font-serif-sc wu-xing-wood">甲</span>
              <span class="text-[#3a3830] text-sm">·</span>
              <span class="text-lg font-serif-sc wu-xing-wood">寅</span>
            </div>
          </div>
          <div class="text-center">
            <div class="text-[10px] text-[#8a8070] mb-1 uppercase tracking-wider">月柱</div>
            <div class="flex items-center justify-center gap-0.5">
              <span class="text-lg font-serif-sc wu-xing-fire">丙</span>
              <span class="text-[#3a3830] text-sm">·</span>
              <span class="text-lg font-serif-sc wu-xing-earth">辰</span>
            </div>
          </div>
          <div class="text-center">
            <div class="text-[10px] text-[#8a8070] mb-1 uppercase tracking-wider">日柱</div>
            <div class="flex items-center justify-center gap-0.5">
              <span class="text-lg font-serif-sc wu-xing-metal">壬</span>
              <span class="text-[#3a3830] text-sm">·</span>
              <span class="text-lg font-serif-sc wu-xing-water">子</span>
            </div>
          </div>
          <div class="text-center">
            <div class="text-[10px] text-[#8a8070] mb-1 uppercase tracking-wider">时柱</div>
            <div class="flex items-center justify-center gap-0.5">
              <span class="text-lg font-serif-sc wu-xing-earth">戊</span>
              <span class="text-[#3a3830] text-sm">·</span>
              <span class="text-lg font-serif-sc wu-xing-fire">午</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 核心指标 -->
    <div class="grid grid-cols-3 gap-3 mx-4 mb-6 animate-fade-in-up stagger-2">
      <div class="card-mystic rounded-xl p-4 text-center">
        <div class="text-[10px] text-[#8a8070] mb-2 uppercase tracking-wider">评分</div>
        <div class="text-2xl font-bold text-[#c9a962]">8.2</div>
        <div class="text-[10px] text-[#5a5040] mt-1">/ 10</div>
      </div>
      <div class="card-mystic rounded-xl p-4 text-center shadow-[0_0_12px_rgba(0,234,178,0.1)]">
        <div class="text-[10px] text-[#8a8070] mb-2 uppercase tracking-wider">日主</div>
        <div class="text-xl font-bold wu-xing-wood">身旺</div>
      </div>
      <div class="card-mystic rounded-xl p-4 text-center">
        <div class="text-[10px] text-[#8a8070] mb-2 uppercase tracking-wider">格局</div>
        <div class="text-lg font-bold text-[#e8e4dc]">正官格</div>
      </div>
    </div>

    <!-- 五行分布 -->
    <div class="mx-4 mb-6 animate-fade-in-up stagger-3">
      <div class="card-mystic rounded-xl p-5">
        <div class="flex items-center justify-between mb-3">
          <span class="text-sm text-[#b8b0a0]">五行分布</span>
          <span class="material-symbols-outlined wu-xing-wood" style="font-size: 16px">eco</span>
        </div>
        <div class="flex h-6 rounded-full overflow-hidden">
          <div class="bg-[#00eab2] flex items-center justify-center text-white text-xs font-medium" style="width: 44%">木</div>
          <div class="bg-[#ffb4ab] flex items-center justify-center text-white text-xs font-medium" style="width: 22%">火</div>
          <div class="bg-[#c9a962] flex items-center justify-center text-[#1a1810] text-xs font-medium" style="width: 11%">土</div>
          <div class="bg-[#e8e4dc] flex items-center justify-center text-[#1a1810] text-xs font-medium" style="width: 11%">金</div>
          <div class="bg-[#d7baff] flex items-center justify-center text-white text-xs font-medium" style="width: 12%">水</div>
        </div>
        <div class="flex justify-between mt-2 text-xs">
          <span class="wu-xing-wood">木 4</span>
          <span class="wu-xing-fire">火 2</span>
          <span class="wu-xing-earth">土 1</span>
          <span class="wu-xing-metal">金 1</span>
          <span class="wu-xing-water">水 2</span>
        </div>
      </div>
    </div>

    <!-- 分隔线 -->
    <div class="mx-4 mb-6 animate-fade-in-up stagger-3">
      <div class="divider-gold"></div>
    </div>

    <!-- 命理总评 -->
    <div class="mx-4 mb-6 animate-fade-in-up stagger-4">
      <div class="card-mystic rounded-xl p-5">
        <div class="flex items-center gap-2 mb-3">
          <span class="material-symbols-outlined text-[#c9a962]" style="font-size: 16px">auto_stories</span>
          <span class="text-sm text-[#b8b0a0]">命理总评</span>
        </div>
        <p class="text-sm text-[#e8e4dc]/80 leading-relaxed">
          日主甲木，生于寅月，得令而旺。木气过盛，宜泄不宜克。格局为正官格，官星清透，有贵气。事业上宜往东方发展，忌西方金旺之地。
        </p>
      </div>
    </div>

    <!-- 喜忌用神 -->
    <div class="mx-4 mb-6 animate-fade-in-up stagger-5">
      <div class="card-mystic rounded-xl p-5">
        <div class="flex items-center gap-2 mb-4">
          <span class="material-symbols-outlined text-[#c9a962]" style="font-size: 16px">spa</span>
          <span class="text-sm text-[#b8b0a0]">喜忌用神</span>
        </div>
        <div class="flex flex-wrap items-center gap-4">
          <div class="text-center">
            <div class="text-[10px] text-[#8a8070] mb-2 uppercase tracking-wider">用神</div>
            <div class="w-7 h-7 rounded-full flex items-center justify-center text-white text-xs font-bold bg-[#e8e4dc]">金</div>
          </div>
          <div class="text-center">
            <div class="text-[10px] text-[#8a8070] mb-2 uppercase tracking-wider">喜神</div>
            <div class="flex gap-1.5">
              <div class="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-medium border border-[#ffb4ab] text-[#ffb4ab]">火</div>
              <div class="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-medium border border-[#c9a962] text-[#c9a962]">土</div>
            </div>
          </div>
          <div class="h-8 w-px bg-[#3a3830]"></div>
          <div class="text-center">
            <div class="text-[10px] text-[#8a8070] mb-2 uppercase tracking-wider">忌神</div>
            <div class="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-medium bg-[#2a2a2a] text-[#555] line-through">水</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 大运 -->
    <div class="mx-4 animate-fade-in-up stagger-5">
      <div class="rounded-xl p-4 bg-gradient-to-r from-[#00eab2]/8 to-[#c9a962]/8 border border-[#3a3830]/50">
        <div class="flex items-center gap-3">
          <div class="w-1 h-9 rounded-full bg-gradient-to-b from-[#00eab2] to-[#c9a962]"></div>
          <div>
            <div class="text-[10px] text-[#8a8070] uppercase tracking-wider">大运提示</div>
            <div class="text-sm text-[#e8e4dc] mt-0.5">37岁起运，逢兔、虎年大吉</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部 -->
    <div class="mt-8 text-center">
      <div class="inline-flex items-center gap-3">
        <span class="text-[#00eab2]/30 text-base">▎</span>
        <span class="text-[#5a5040] text-xs tracking-widest">虚怀若谷 · 顺势而为</span>
        <span class="text-[#00eab2]/30 text-base">▎</span>
      </div>
    </div>

  </div>

  <!-- 底部说明 -->
  <div class="fixed bottom-0 left-0 right-0 bg-[#0f1318]/95 backdrop-blur border-t border-[#3a3830]/50 p-4">
    <div class="max-w-md mx-auto text-center">
      <div class="text-sm font-medium text-[#c9a962] mb-1">方案F · 黑金新中式（中间方案）</div>
      <div class="text-xs text-[#8a8070]">黑金版式 + 新中式简化风格 | 介于E和D之间</div>
    </div>
  </div>
</body>
</html>
